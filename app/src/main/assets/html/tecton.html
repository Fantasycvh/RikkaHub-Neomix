<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="./pako.min.js"></script>
    <script src="./imports.js"></script>
    <script src="./engine.js"></script>
</head>
<body>
    <div id="status">loading</div>
    <script>
        // 普通 script（非 ES module）：Android WebView 下 module+import 静默失败，普通 script 保证执行。
        const statusEl = document.getElementById('status');
        const report = (s) => {
            statusEl.textContent = s;
            document.title = 'TIKZ: ' + s;
            if (window.AndroidInterface) AndroidInterface.onProgress(s);
        };
        const reportError = (s) => {
            statusEl.textContent = 'ERROR: ' + s;
            document.title = 'TIKZ-ERR: ' + s;
            if (window.AndroidInterface) AndroidInterface.onError(s);
        };

        // 兜底标记：script 同步执行即立刻回调，区分"HTML 加载但 JS 没跑"
        report('script-started');

        // URL fragment：base64url 编码的 UTF-8 TikZ 代码
        function decodeHash() {
            const hash = location.hash.slice(1);
            if (!hash) return null;
            const b64 = hash.replace(/-/g, '+').replace(/_/g, '/');
            let padded = b64;
            while (padded.length % 4) padded += '=';
            const bin = atob(padded);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder('utf-8').decode(bytes);
        }

        // 解 tar（UStar 平铺格式）
        function parseTar(bytes) {
            const files = {};
            let off = 0;
            while (off + 512 <= bytes.byteLength) {
                const nameBytes = bytes.subarray(off, off + 100);
                let nameEnd = nameBytes.indexOf(0);
                if (nameEnd < 0) nameEnd = 100;
                const name = new TextDecoder().decode(nameBytes.subarray(0, nameEnd));
                if (name.length === 0) break;
                const sizeStr = new TextDecoder().decode(bytes.subarray(off + 124, off + 136)).replace(/\0/g, '').trim();
                const size = parseInt(sizeStr, 8) || 0;
                const typeflag = String.fromCharCode(bytes[off + 156]);
                if (typeflag !== '5') {
                    files[name] = bytes.subarray(off + 512, off + 512 + size);
                }
                off = off + 512 + Math.ceil(size / 512) * 512;
            }
            return files;
        }

        async function main() {
            const tikzCode = decodeHash();
            if (!tikzCode) { reportError('empty code'); return; }

            // 1. 解压 bundle
            report('解压 bundle...');
            const bundleResp = await fetch('./tectonic-bundle.tikzbundle');
            const gz = new Uint8Array(await bundleResp.arrayBuffer());
            const tar = pako.ungzip(gz);
            const files = parseTar(tar);

            // 2. 加载 wasm + 注入 bundle
            report('加载引擎...');
            const engine = await TexEngine.load(await fetch('./tectonic_wasm.wasm'));
            engine.addFiles(files);

            // 3. 注入中文字体
            const fontResp = await fetch('./simhei.ttf');
            engine.addFile('simhei.ttf', new Uint8Array(await fontResp.arrayBuffer()));

            // 4. 组装 tex：article 类 + tikz + 中文字体
            const tex = `\\documentclass{article}
\\usepackage{tikz}
\\begin{document}
${tikzCode}
\\end{document}`;
            engine.addFile('main.tex', tex);

            // 5. 编译
            report('编译中...');
            const result = engine.compile({ entry: 'main.tex' });
            if (result.status === 'failed') {
                const msg = (result.message || '') + ' ' +
                    (result.diagnostics || []).slice(0, 3).map(d => d.message).join(' | ');
                reportError(msg);
                return;
            }

            // 6. 取 PDF，传给 Android
            const pdf = engine.pdf();
            if (!pdf || pdf.length === 0) { reportError('empty pdf'); return; }
            report(`完成 (${pdf.length} bytes)`);

            // base64 传回（PDF 通常几 KB，可接受）
            let binary = '';
            const chunkSize = 0x8000;
            for (let i = 0; i < pdf.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, pdf.subarray(i, i + chunkSize));
            }
            const b64 = btoa(binary);
            if (window.AndroidInterface) AndroidInterface.onPdf(b64);
        }

        main().catch((e) => {
            console.log('main err', e);
            reportError(e.message || String(e));
        });
    </script>
</body>
</html>
