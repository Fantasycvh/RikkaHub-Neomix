<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./fonts.css">
    <script src="./tikzjax.js"></script>
    <style>
        body {
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
            background: transparent;
        }
        #tikz-container {
            display: inline-block;
            max-width: 100%;
        }
        #tikz-container svg {
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <div id="tikz-container"></div>
    <script>
        function report(msg) {
            if (window.AndroidInterface) AndroidInterface.onError(msg);
        }

        // 全局错误捕获，让 Android 端能看到具体失败点
        window.addEventListener('error', function (e) {
            report('error: ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno);
        });
        window.addEventListener('unhandledrejection', function (e) {
            report('rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
        });

        // 读 URL fragment（base64url 编码的 UTF-8 TikZ 代码），动态注入 <script type="text/tikz">
        (function () {
            var hash = location.hash.slice(1);
            if (!hash) {
                report('empty hash');
                return;
            }
            try {
                var b64 = hash.replace(/-/g, '+').replace(/_/g, '/');
                while (b64.length % 4) b64 += '=';
                var bin = atob(b64);
                var code = decodeURIComponent(Array.prototype.map.call(bin, function (c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                var script = document.createElement('script');
                script.type = 'text/tikz';
                script.textContent = code;
                document.getElementById('tikz-container').appendChild(script);
            } catch (e) {
                report('decode: ' + e.message);
            }
        })();

        // 渲染超时检测：15 秒后若仍无 svg，报告当前状态
        setTimeout(function () {
            var svg = document.querySelector('#tikz-container svg');
            if (!svg) {
                var hasTikzJax = typeof window.TikzJax !== 'undefined';
                var scripts = document.querySelectorAll('script[type="text/tikz"]').length;
                report('timeout: svg=0 tikzjax=' + hasTikzJax + ' scripts=' + scripts);
            }
        }, 15000);

        // 轮询等待原版 tikzjax 渲染出 svg，回传实际高度驱动 WebView 尺寸自适应
        (function poll() {
            var svg = document.querySelector('#tikz-container svg');
            if (svg) {
                var rect = svg.getBoundingClientRect();
                if (rect.height > 0 && window.AndroidInterface) {
                    AndroidInterface.onSvgHeight(rect.height);
                    return;
                }
            }
            setTimeout(poll, 200);
        })();

        // 导出 PNG（复用 mermaid 的 SVG→PNG 序列化模板）
        window.exportSvgToPng = function () {
            try {
                var svgElement = document.querySelector('#tikz-container svg');
                if (!svgElement) {
                    AndroidInterface.exportImage('');
                    return;
                }
                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d');
                var rect = svgElement.getBoundingClientRect();
                var width = rect.width;
                var height = rect.height;
                var scaleFactor = window.devicePixelRatio * 2;
                canvas.width = width * scaleFactor;
                canvas.height = height * scaleFactor;
                var svgXml = new XMLSerializer().serializeToString(svgElement);
                var svgBase64 = btoa(unescape(encodeURIComponent(svgXml)));
                var img = new Image();
                img.onload = function () {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    var pngBase64 = canvas.toDataURL('image/png').split(',')[1];
                    AndroidInterface.exportImage(pngBase64);
                };
                img.onerror = function () { AndroidInterface.exportImage(''); };
                img.src = 'data:image/svg+xml;base64,' + svgBase64;
            } catch (e) {
                AndroidInterface.exportImage('');
            }
        };
    </script>
</body>
</html>
