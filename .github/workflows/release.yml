name: Release

# tag 触发的正式发版流水线（对齐手工发版流程，如 1.0.28-beta.13 / v1.0.27）：
# 构建签名 release APK → 以 tag 名建 GitHub Release（版本含 beta 即 prerelease）并上传 arm64 资产。
#
# 必需 repo secrets（与 daily-build.yml 同一套）：
#   KEY_BASE64     — release keystore 的 base64（解码后落到 app/app.key）
#   SIGNING_CONFIG — 写入 local.properties 的原文，必须包含四行（storeFile 相对 app/ 解析）：
#       storeFile=app.key
#       storePassword=...
#       keyAlias=...
#       keyPassword=...

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-*'
      - 'v[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release 需要写权限

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # AGP 9.x 的配置期在 JDK 17 上有失败案例（nmoi D189 的教训）；本机开发环境是 21，
          # CI 与其一致化，消除"本地过、CI 挂"的环境差
          java-version: '21'

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare signing
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        run: |
          # 解码 keystore 并写入签名配置到 local.properties
          echo "$KEY_BASE64" | base64 -d > app/app.key
          echo "$SIGNING_CONFIG" > local.properties

          # 显式校验四个键齐全：signingConfigs 读不到时不会报错，而是静默产出 unsigned 包
          for k in storeFile storePassword keyAlias keyPassword; do
            grep -q "^$k=" local.properties || { echo "::error::local.properties 缺少 $k（检查 SIGNING_CONFIG secret 格式）"; exit 1; }
          done
          [ -s app/app.key ] || { echo "::error::keystore 解码为空（检查 KEY_BASE64 secret）"; exit 1; }

      - name: Resolve version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          # tag 与构建版本一致性守卫：tag 打错了构建出来也发不出去
          if [ "v$VERSION_NAME" != "${{ github.ref_name }}" ] && [ "$VERSION_NAME" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} 与 versionName $VERSION_NAME 不一致"
            exit 1
          fi

      # 失败时先自述环境：SDK 里到底装了哪些 platform / build-tools、gradle 什么版本，
      # 排查不用靠猜是哪件缺了（借 nmoi ci.yml 的环境自述手法）
      - name: 环境自述
        run: |
          set -x
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          gradle --version || ./gradlew --version

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # 验签闸：产物必须出自钉死的 release 密钥（CN=neomix）。
      # 签名配置缺失/被 AGP 静默降级/secret 配错钥匙，都会在这里拦下——
      # 前面的 local.properties 四键校验只验输入，这道闸验的是产物本身。
      - name: 验签（固定指纹闸）
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*arm64-v8a-release.apk' | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          want="d15b693a2010b2ee5f78f3a6eed0a157e074b4b20f476ec31f5c9174d94eec78"
          got=$("$APKSIGNER" verify --print-certs "$apk" \
                | grep -i "certificate SHA-256 digest" | head -1 \
                | sed 's/.*digest: *//' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "签名指纹：$got"
          [ "$got" = "$want" ] \
            || { echo "签名指纹不对：期望 $want。要么 secret 不是那把钥匙，要么它没被用上" >&2; exit 1; }
          echo "固定签名 ✓"

      # 包名 + 启动入口对账：本仓桌面入口是「默认 RouteActivity + 4 预置」五个真实 Activity
      # （特意不用 activity-alias，见 AndroidManifest.xml 注释），预置漂移编译期不可见，
      # 表现是设置里切了没反应——做成闸，不做"记得看一下"。
      - name: 包名与启动入口对账
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*arm64-v8a-release.apk' | head -1)
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)

          pkg=$("$AAPT2" dump badging "$apk" | sed -nE "s/^package: name='([^']+)'.*/\1/p" | head -1)
          echo "package=$pkg"
          [ "$pkg" = "app.androidrik.rikkahub" ] \
            || { echo "APK 包名是 $pkg，应为 app.androidrik.rikkahub" >&2; exit 1; }

          tree=$("$AAPT2" dump xmltree --file AndroidManifest.xml "$apk")
          # 只数「组件节点内」的 LAUNCHER：<queries> 里的包可见性 intent 也带这个 category，
          # 整树 raw grep 会多数（本仓 manifest 就有一处 queries/LAUNCHER）
          launchers=$(printf '%s\n' "$tree" | awk '
            /^[[:space:]]*E: (activity|activity-alias|service|receiver|provider) \(/ { if (incomp) { total += flag }; incomp=1; flag=0; next }
            incomp && /android.intent.category.LAUNCHER/ { flag=1 }
            END { if (incomp) total += flag; print total + 0 }
          ')
          echo "LAUNCHER 入口数量=$launchers"
          [ "$launchers" -eq 5 ] \
            || { echo "启动入口应 5 个（默认 + 4 预置），实际 $launchers：桌面入口切换会缺项" >&2; exit 1; }

          for want in RouteActivity LauncherRikkaHubActivity LauncherChatActivity LauncherNotesActivity LauncherAssistantActivity; do
            printf '%s\n' "$tree" | grep -q "app.androidrik.rikkahub.$want" \
              || { echo "APK manifest 里找不到启动入口 $want" >&2; exit 1; }
          done
          echo "启动入口齐全 ✓"

      - name: Prepare asset
        run: |
          # 发布资产命名对齐既有 release（Neomix-<version>-arm64-v8a.apk），只发 arm64
          cp app/build/outputs/apk/release/*arm64-v8a-release.apk \
             "Neomix-${{ steps.version.outputs.name }}-arm64-v8a.apk"

      # 发布说明优先取仓内存档 docs/releases/<version>.md（去掉顶部两行存档注释），
      # 没有就用兜底文案——本地发版前的存档习惯保持不变，CI 只是兜底
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE_FLAG="--prerelease"
          case "$VERSION" in *beta*|*exp*|*alpha*|*rc*) ;; *) PRERELEASE_FLAG="" ;; esac
          if [ -f "docs/releases/$VERSION.md" ]; then
            tail -n +3 "docs/releases/$VERSION.md" > /tmp/notes.md
          else
            printf 'Automated release for `%s (%s)`.\n\nNon-official fork, not affiliated with upstream rikkahub/rikkahub. AGPL-3.0.\n' \
              "$VERSION" "$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)" > /tmp/notes.md
          fi
          gh release create "$TAG" \
            $PRERELEASE_FLAG \
            --title "$VERSION (${{ steps.version.outputs.code }})" \
            --notes-file /tmp/notes.md \
            "Neomix-$VERSION-arm64-v8a.apk"
