name: Daily Build

on:
  # 自动触发（原每日 UTC 18:00 定时）已禁用：本仓暂不发预编译包，
  # 且签名的 repo secrets 尚未配置。需要时在 Actions 页面手动运行。
  workflow_dispatch:

jobs:
  # 检查过去 24 小时内是否有新提交，没有则跳过构建，避免重复打包
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for recent commits
        id: check
        run: |
          # 手动触发时无条件构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 定时触发：仅当过去 24 小时内有新提交才构建
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          # AGP 9.x 的配置期在 JDK 17 上有失败案例（nmoi D189）；与本机开发环境（21）一致化
          java-version: '21'

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        run: |
          # 解码base64编码的keystore文件
          echo "$KEY_BASE64" | base64 -d > app/app.key

          # 写入签名配置到local.properties。secret 必须包含四行（storeFile 相对 app/ 解析）：
          #   storeFile=app.key
          #   storePassword=...
          #   keyAlias=...
          #   keyPassword=...
          echo "$SIGNING_CONFIG" > local.properties

          # 显式校验：signingConfigs 读不到键时不会报错，而是静默产出 unsigned 包
          for k in storeFile storePassword keyAlias keyPassword; do
            grep -q "^$k=" local.properties || { echo "::error::local.properties 缺少 $k（检查 SIGNING_CONFIG secret 格式）"; exit 1; }
          done
          [ -s app/app.key ] || { echo "::error::keystore 解码为空（检查 KEY_BASE64 secret）"; exit 1; }

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # 验签闸：有签名材料时产物必须出自钉死的 release 密钥（CN=neomix）；
      # 没有时是 debug 签名（预期内），只打印证书信息不拦。
      - name: 验签（固定指纹闸）
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*arm64-v8a-release.apk' | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          want="d15b693a2010b2ee5f78f3a6eed0a157e074b4b20f476ec31f5c9174d94eec78"
          got=$("$APKSIGNER" verify --print-certs "$apk" \
                | grep -i "certificate SHA-256 digest" | head -1 \
                | sed 's/.*digest: *//' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "签名指纹：$got"
          if grep -q '^storeFile=' local.properties; then
            [ "$got" = "$want" ] \
              || { echo "签名指纹不对：期望 $want。要么 secret 不是那把钥匙，要么它没被用上" >&2; exit 1; }
            echo "固定签名 ✓"
          else
            echo "无签名材料：debug 签名包，仅能本机随手试（预期内）"
          fi

      # 发布 nightly：删旧 Release + tag 后在**当前 commit** 重建（--target HEAD），
      # 让 nightly tag 永远指向最新提交、排在 tag 列表最前面，而不是停在首建那天
      - name: Publish nightly prerelease（tag 定位到最新）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*arm64-v8a-release.apk' | head -1)
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          git push origin ":refs/tags/nightly" 2>/dev/null || true
          {
            echo "自动每日构建（commit \`${GITHUB_SHA}\`）"
            echo ""
            echo "> ⚠️ 开发版本，可能不稳定，仅供测试。"
          } > /tmp/nightly-notes.md
          gh release create nightly \
            --prerelease \
            --title "Nightly Build" \
            --notes-file /tmp/nightly-notes.md \
            --target "$GITHUB_SHA" \
            "$apk"
          echo "nightly 已重建于 $(git rev-parse --short HEAD)"
